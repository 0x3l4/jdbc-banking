databaseChangeLog:
  - changeSet:
      id: 003-create-transfers
      author: alexander.vereta
      changes:
        - createTable:
            tableName: transfers
            remarks: "Успешно завершённые переводы"
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_transfers
                    nullable: false
              - column:
                  name: initiated_by
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: idempotency_key
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: from_account_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: to_account_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: NUMERIC(19, 4)
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: transfers
            baseColumnNames: initiated_by
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_transfers_initiator
            onDelete: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: transfers
            baseColumnNames: from_account_id, currency
            referencedTableName: accounts
            referencedColumnNames: id, currency
            constraintName: fk_transfers_source_account_currency
            onDelete: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: transfers
            baseColumnNames: to_account_id, currency
            referencedTableName: accounts
            referencedColumnNames: id, currency
            constraintName: fk_transfers_target_account_currency
            onDelete: RESTRICT
        - addUniqueConstraint:
            tableName: transfers
            columnNames: initiated_by, idempotency_key
            constraintName: uq_transfers_initiator_idempotency
        - sql:
            sql: |
              ALTER TABLE transfers
                ADD CONSTRAINT chk_transfers_distinct_accounts CHECK (from_account_id <> to_account_id);
              ALTER TABLE transfers
                ADD CONSTRAINT chk_transfers_amount_positive CHECK (amount > 0);
              ALTER TABLE transfers
                ADD CONSTRAINT chk_transfers_currency CHECK (currency ~'^[A-Z]{3}$');
      rollback:
        - dropTable:
            tableName: transfers
